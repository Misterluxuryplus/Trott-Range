<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  /* FOND BIEN VISIBLE */
  background: linear-gradient(135deg, #0072ff, #00c6ff);

  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #00ff84;
  margin-bottom: 5px;
  font-size: 26px;
}

.subtitle {
  text-align: center;
  color: #ffffff;
  margin-bottom: 22px;
  font-size: 14px;
}

.container {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 300px;

  /* IMPORTANT → on rend les blocs un peu transparents */
  background: rgba(0,0,0,0.75);

  border-radius: 18px;
  padding: 18px;
}

h3 {
  margin-top: 0;
  font-size: 18px;
  margin-bottom: 12px;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
  color: black;
  font-size: 15px;
}

.btn-group {
  margin-top: 18px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #00e56f;
  color: black;
}

.result-box {
  margin-top: 18px;
  background: rgba(0,0,0,0.75);
  border-radius: 18px;
  padding: 18px;
}

.result {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.6;
}

.good { color: #00ff84; }
.warn { color: #ffcc66; }
.bad  { color: #ff6b6b; }
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="container">

  <div class="card">
    <h3>Batterie</h3>

    <label>Batterie (%)</label>
    <input type="number" id="batteryPercent" value="100">

    <label>Poids</label>
    <input type="number" id="weight" value="80">

    <label>Volts</label>
    <input type="number" id="voltage" value="60">

    <label>Ah</label>
    <input type="number" id="ah" value="35">
  </div>

  <div class="card">
    <h3>Trajet</h3>

    <label>Mode</label>
    <select id="mode">
      <option value="eco">Eco</option>
      <option value="confort" selected>Confort</option>
      <option value="sport">Sport</option>
    </select>

    <label>Vitesse</label>
    <input type="number" id="speed" value="45">

    <label>Distance</label>
    <input type="number" id="distance" value="10">

    <div class="btn-group">
      <button onclick="calculate()">Calculer</button>
    </div>
  </div>

</div>

<div class="result-box">
  <div class="result" id="result">
    Clique sur calculer
  </div>
</div>

<script>
function calculate() {
  const voltage = +document.getElementById("voltage").value;
  const ah = +document.getElementById("ah").value;
  const speed = +document.getElementById("speed").value;
  const distance = +document.getElementById("distance").value;
  const mode = document.getElementById("mode").value;

  let whPerKm = (mode === "eco") ? 11 : (mode === "confort") ? 16 : 22;

  if (speed > 40) whPerKm += 2;

  const autonomie = (voltage * ah) / whPerKm;

  const allerOK = autonomie >= distance;
  const arOK = autonomie >= distance * 2;

  document.getElementById("result").innerHTML =
    "Autonomie : " + autonomie.toFixed(1) + " km<br>" +
    "Aller : " + (allerOK ? "OK" : "NON") + "<br>" +
    "A/R : " + (arOK ? "OK" : "NON");
}
</script>

</body>
</html>
