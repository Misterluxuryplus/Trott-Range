<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  margin:0;
  padding:8px;
}

h1{
  text-align:center;
  color:#00e676;
  font-size:18px;
  margin:5px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.box{
  background:#1c1c1c;
  padding:8px;
  border-radius:8px;
}

label{
  font-size:12px;
}

input, select{
  width:100%;
  padding:6px;
  font-size:13px;
  border:none;
  border-radius:5px;
  margin-bottom:6px;
}

button{
  width:100%;
  padding:8px;
  background:#00e676;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:8px;
  background:#1c1c1c;
  padding:10px;
  border-radius:8px;
  font-size:13px;
}

.highlight{
  font-size:16px;
  font-weight:bold;
}

.good{color:#00e676;}
.warn{color:orange;}
.bad{color:red;}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>

<div class="grid">

<div class="box">
<label>Batterie (%)</label>
<input type="number" id="battery" value="100" max="100" min="0">

<label>Poids (kg)</label>
<input type="number" id="weight" value="100">

<label>Volts (V)</label>
<select id="volts" onchange="updateWh()">
<option value="36">36</option>
<option value="48">48</option>
<option value="52">52</option>
<option value="60" selected>60</option>
<option value="72">72</option>
</select>

<label>Ampérage (Ah)</label>
<select id="ah" onchange="updateWh()">
<option value="15">15</option>
<option value="18">18</option>
<option value="20">20</option>
<option value="24">24</option>
<option value="28">28</option>
<option value="30">30</option>
<option value="35" selected>35</option>
<option value="40">40</option>
<option value="45">45</option>
<option value="50">50</option>
</select>

<label>Capacité batterie (Wh)</label>
<input type="number" id="wh" readonly>
</div>

<div class="box">
<label>Mode de conduite</label>
<select id="mode">
<option value="16">Éco</option>
<option value="22" selected>Confort</option>
<option value="32">Escalade</option>
</select>

<label>Vitesse (km/h)</label>
<select id="speed">
<option value="1">25</option>
<option value="1.1">35</option>
<option value="1.2" selected>45</option>
<option value="1.35">55</option>
</select>

<label>Distance aller (km)</label>
<input type="number" id="distance" value="10">

<button onclick="calc()">Calculer</button>
</div>

</div>

<div class="result" id="result">
Clique sur calculer
</div>

<script>

function updateWh(){
  let v = parseFloat(document.getElementById("volts").value);
  let ah = parseFloat(document.getElementById("ah").value);
  document.getElementById("wh").value = (v*ah).toFixed(0);
}

function calc(){

  let battery = parseFloat(document.getElementById("battery").value);
  if(battery>100) battery=100;
  if(battery<0) battery=0;
  document.getElementById("battery").value = battery;

  let weight = parseFloat(document.getElementById("weight").value);
  let wh = parseFloat(document.getElementById("wh").value);
  let mode = parseFloat(document.getElementById("mode").value);
  let speed = parseFloat(document.getElementById("speed").value);
  let distance = parseFloat(document.getElementById("distance").value);

  let dispo = wh*(battery/100);

  // ajustement poids réaliste
  let weightFactor = 1;
  if(weight<=75) weightFactor=0.92;
  else if(weight<=90) weightFactor=0.98;
  else if(weight<=105) weightFactor=1.05;
  else if(weight<=120) weightFactor=1.12;
  else weightFactor=1.20;

  // conso avec sécurité
  let conso = mode * speed * weightFactor * 1.10;

  let autonomie = dispo / conso;
  let ar = distance*2;

  let txt = "";

  txt += "🔋 Batterie : "+wh.toFixed(0)+" Wh<br>";
  txt += "⚡ Énergie dispo : "+dispo.toFixed(0)+" Wh<br>";
  txt += "⚙️ Conso : "+conso.toFixed(1)+" Wh/km<br>";
  txt += "<span class='highlight'>🛴 Autonomie : "+autonomie.toFixed(1)+" km</span><br>";
  txt += "📏 Aller : "+distance+" km<br>";
  txt += "🔁 Aller-retour : "+ar+" km<br><br>";

  if(autonomie >= ar){
    let reste = dispo - (ar*conso);
    let pourcent = (reste/wh)*100;

    txt += "<span class='good highlight'>✅ Aller-retour OK</span><br>";
    txt += "🔋 Batterie restante : "+pourcent.toFixed(0)+" %";
  }

  else if(autonomie >= distance){
    let reste = dispo - (distance*conso);
    let pourcent = (reste/wh)*100;

    txt += "<span class='warn highlight'>⚠️ Aller OK / retour limite</span><br>";
    txt += "🔋 Batterie restante à l'arrivée : "+pourcent.toFixed(0)+" %";
  }

  else{
    txt += "<span class='bad highlight'>❌ Trajet impossible</span>";
  }

  txt += "<br><br><span style='font-size:11px;color:#aaa;'>Estimation indicative basée sur des conditions moyennes. Les résultats peuvent varier selon le terrain, la température et le style de conduite.</span>";

  document.getElementById("result").innerHTML = txt;
}

updateWh();

</script>

</body>
</html>
