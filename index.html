<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #103b75, #1565e8, #1da9e8);
  color: white;
  padding: 20px;
}

.wrap { max-width: 1150px; margin: 0 auto; }

h1 { text-align: center; margin: 0 0 6px; font-size: 28px; }

.subtitle {
  text-align: center;
  margin-bottom: 24px;
  color: #e6eefc;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.card, .result-card {
  background: rgba(0, 22, 48, 0.92);
  border-radius: 20px;
  padding: 20px;
}

h3 { margin: 0 0 16px; font-size: 20px; }

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border-radius: 14px;
  border: none;
  background: #d9d9d9;
  color: black;
}

.speed-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.speed-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #0fd96f;
  font-weight: bold;
  cursor: pointer;
}

.calc-btn {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: #10df72;
  font-weight: bold;
  cursor: pointer;
}

.result-card { margin-top: 20px; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
}

.stat-label {
  font-size: 12px;
  color: #bcd1ef;
}

.stat-value {
  font-size: 20px;
  font-weight: bold;
}

/* Couleurs batterie */
.battery-good { color: #11f28c; font-weight: bold; }
.battery-warn { color: #ffca4f; font-weight: bold; }
.battery-bad { color: #ff3b3b; font-weight: bold; }

/* Clignotement */
.alert-box {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.03); opacity: 0.35; }
  100% { transform: scale(1); opacity: 1; }
}

.status-line {
  font-size: 20px;
  margin-bottom: 12px;
  font-weight: bold;
}

.message {
  font-size: 18px;
  margin-top: 10px;
  color: #ff3b3b;
  font-weight: bold;
}

.note {
  margin-top: 12px;
  text-align: center;
  font-size: 13px;
  color: #cfe3ff;
}

@media (max-width: 850px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>
<div class="wrap">

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="grid">

<div class="card">
<h3>🔋 Batterie</h3>

<label>Batterie (%)</label>
<input type="number" id="batteryPercent" value="100" min="1" max="100">

<label>Poids</label>
<input type="number" id="weight" value="80">

<label>Volts</label>
<select id="voltage">
  <option value="36">36</option>
  <option value="48">48</option>
  <option value="52">52</option>
  <option value="60" selected>60</option>
  <option value="72">72</option>
</select>

<label>Ah</label>
<select id="ah">
  <option value="13">13</option>
  <option value="15">15</option>
  <option value="18">18</option>
  <option value="20">20</option>
  <option value="21">21</option>
  <option value="24">24</option>
  <option value="26">26</option>
  <option value="28">28</option>
  <option value="30">30</option>
  <option value="35" selected>35</option>
  <option value="40">40</option>
</select>
</div>

<div class="card">
<h3>🛣️ Trajet</h3>

<label>Mode</label>
<select id="mode">
  <option value="eco">Eco</option>
  <option value="confort" selected>Confort</option>
  <option value="sport">Sport</option>
</select>

<label>Vitesse</label>
<input type="number" id="speed" value="45">

<div class="speed-buttons">
  <button type="button" onclick="setSpeed(25)">25</button>
  <button type="button" onclick="setSpeed(45)">45</button>
  <button type="button" onclick="setSpeed(55)">55</button>
</div>

<label>Distance aller</label>
<input type="number" id="distance" value="10">

<button type="button" class="calc-btn" onclick="calculate()">Calculer</button>
</div>

</div>

<div class="result-card">

<div class="stats">
  <div class="stat"><div class="stat-label">Batterie</div><div id="batteryWh" class="stat-value"></div></div>
  <div class="stat"><div class="stat-label">Conso</div><div id="consumption" class="stat-value"></div></div>
  <div class="stat"><div class="stat-label">Autonomie</div><div id="rangeKm" class="stat-value"></div></div>

  <div class="stat"><div class="stat-label">Après aller</div><div id="batteryAfterGo" class="stat-value"></div></div>
  <div class="stat"><div class="stat-label">Après A/R</div><div id="batteryAfterRoundTrip" class="stat-value"></div></div>
  <div class="stat"><div class="stat-label">Distance A/R</div><div id="roundTripDistance" class="stat-value"></div></div>
</div>

<div class="status-line" id="statusLine"></div>
<div class="message" id="message"></div>

<div class="note">
Résultat approximatif : ne prend pas en compte le vent, les montées, la pression des pneus ou l’état de la route.
</div>

</div>

</div>

<script>
function setSpeed(v) {
  document.getElementById("speed").value = v;
}

function batteryClass(p) {
  if (p < 30) return "battery-bad";
  if (p < 50) return "battery-warn";
  return "battery-good";
}

function calculate() {
  let batteryPercent = Math.min(100, Math.max(1, +document.getElementById("batteryPercent").value));
  document.getElementById("batteryPercent").value = batteryPercent;

  let weight = +document.getElementById("weight").value;
  let voltage = +document.getElementById("voltage").value;
  let ah = +document.getElementById("ah").value;
  let speed = +document.getElementById("speed").value;
  let distance = +document.getElementById("distance").value;
  let mode = document.getElementById("mode").value;

  let totalWh = voltage * ah;
  let usableWh = totalWh * (batteryPercent / 100) * 0.95;

  let whPerKm = mode === "eco" ? 9.2 : mode === "confort" ? 10.4 : 13.8;

  whPerKm += (weight - 80) * 0.04;

  if (speed <= 25) whPerKm -= 0.5;
  else if (speed <= 30) {}
  else if (speed <= 35) whPerKm += 0.8;
  else if (speed <= 45) whPerKm += 2;
  else if (speed <= 55) whPerKm += 4.2;
  else whPerKm += 6.5;

  whPerKm = Math.max(8.5, whPerKm);

  let autonomie = usableWh / whPerKm;
  let roundTrip = distance * 2;

  let afterGo = batteryPercent - (distance * whPerKm / totalWh * 100);
  let afterAR = batteryPercent - (roundTrip * whPerKm / totalWh * 100);

  afterGo = Math.max(0, afterGo);
  afterAR = Math.max(0, afterAR);

  document.getElementById("batteryWh").innerText = Math.round(totalWh) + " Wh";
  document.getElementById("consumption").innerText = whPerKm.toFixed(1) + " Wh/km";
  document.getElementById("rangeKm").innerText = autonomie.toFixed(1) + " km";

  document.getElementById("batteryAfterGo").innerHTML =
    "<span class='" + batteryClass(afterGo) + "'>" + afterGo.toFixed(0) + "%</span>";

  let arElement = document.getElementById("batteryAfterRoundTrip");
  arElement.innerHTML =
    "<span class='" + batteryClass(afterAR) + "'>" + afterAR.toFixed(0) + "%</span>";

  arElement.classList.remove("alert-box");
  if (afterAR < 30) arElement.classList.add("alert-box");

  document.getElementById("roundTripDistance").innerText = roundTrip + " km";

  document.getElementById("statusLine").innerHTML =
    "Aller : " + (autonomie >= distance ? "OK" : "NON") + "<br>" +
    "Aller-retour : " + (autonomie >= roundTrip ? "OK" : "NON");

  let msg = "";
  if (afterAR < 30) {
    msg = "⚠️ Batterie trop basse, évite de descendre sous 30%";
  }

  document.getElementById("message").innerHTML = msg;
}
</script>

</body>
</html>
