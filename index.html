<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur autonomie</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #05070b;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #00ff84;
      margin-bottom: 8px;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #d6d6d6;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .card {
      background: #161616;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(0, 255, 132, 0.08);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .section-title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffffff;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #e9e9e9;
      color: #111;
      font-size: 30px;
      outline: none;
    }

    .readonly {
      background: #dfe6dd;
      font-weight: bold;
    }

    .btns {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 180px;
      padding: 18px;
      border: none;
      border-radius: 18px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .calc-btn {
      background: #00e56f;
      color: black;
      box-shadow: 0 0 20px rgba(0, 229, 111, 0.25);
    }

    .reset-btn {
      background: #2c2c2c;
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .result-box {
      margin-top: 25px;
      background: #161616;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(0, 255, 132, 0.08);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .result-title {
      font-size: 32px;
      font-weight: bold;
      color: #00ff84;
      margin-bottom: 16px;
    }

    .result {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.5;
    }

    .note {
      margin-top: 15px;
      color: #bdbdbd;
      font-size: 18px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .section-title,
      .result-title {
        font-size: 24px;
      }

      label {
        font-size: 18px;
      }

      input, select {
        font-size: 22px;
        padding: 14px;
      }

      button {
        font-size: 22px;
      }

      .result {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Calculateur autonomie</h1>
    <div class="subtitle">Estimation rapide avant un trajet</div>

    <div class="card">
      <div class="section-title">🔋 Paramètres</div>

      <label for="batteryPercent">Batterie (%)</label>
      <input type="number" id="batteryPercent" placeholder="Ex : 100" />

      <label for="weight">Poids (kg)</label>
      <input type="number" id="weight" placeholder="Ex : 90" />

      <label for="voltage">Volts (V)</label>
      <input type="number" id="voltage" placeholder="Ex : 60" />

      <label for="ah">Ampérage (Ah)</label>
      <input type="number" id="ah" placeholder="Ex : 35" />

      <label for="wh">Capacité batterie (Wh)</label>
      <input type="number" id="wh" class="readonly" readonly placeholder="Calcul automatique" />

      <label for="mode">Mode de conduite</label>
      <select id="mode">
        <option value="">Choisir</option>
        <option value="eco">Eco</option>
        <option value="confort">Confort</option>
        <option value="sport">Sport</option>
      </select>

      <label for="speed">Vitesse (km/h)</label>
      <input type="number" id="speed" placeholder="Ex : 45" />

      <label for="distance">Distance aller (km)</label>
      <input type="number" id="distance" placeholder="Ex : 10" />

      <div class="btns">
        <button class="calc-btn" onclick="calculateRange()">Calculer</button>
        <button class="reset-btn" onclick="resetForm()">Reset</button>
      </div>
    </div>

    <div class="result-box">
      <div class="result-title">📊 Résultat autonomie</div>
      <div class="result" id="result">Remplis les champs puis clique sur Calculer</div>
      <div class="note">Résultat indicatif, cela ne reflète pas exactement les conditions réelles.</div>
    </div>
  </div>

  <script>
    const voltageInput = document.getElementById("voltage");
    const ahInput = document.getElementById("ah");
    const whInput = document.getElementById("wh");

    function updateWh() {
      const voltage = parseFloat(voltageInput.value);
      const ah = parseFloat(ahInput.value);

      if (!isNaN(voltage) && !isNaN(ah)) {
        whInput.value = (voltage * ah).toFixed(0);
      } else {
        whInput.value = "";
      }
    }

    voltageInput.addEventListener("input", updateWh);
    ahInput.addEventListener("input", updateWh);

    function calculateRange() {
      const batteryPercent = parseFloat(document.getElementById("batteryPercent").value);
      const weight = parseFloat(document.getElementById("weight").value);
      const voltage = parseFloat(document.getElementById("voltage").value);
      const ah = parseFloat(document.getElementById("ah").value);
      const speed = parseFloat(document.getElementById("speed").value);
      const distance = parseFloat(document.getElementById("distance").value);
      const mode = document.getElementById("mode").value;
      const result = document.getElementById("result");

      if (
        isNaN(batteryPercent) ||
        isNaN(weight) ||
        isNaN(voltage) ||
        isNaN(ah) ||
        isNaN(speed) ||
        isNaN(distance) ||
        !mode
      ) {
        result.innerHTML = "Merci de remplir tous les champs.";
        return;
      }

      let totalWh = voltage * ah;
      let usableWh = totalWh * (batteryPercent / 100);

      let whPerKm = 0;

      if (mode === "eco") whPerKm = 11;
      if (mode === "confort") whPerKm = 16;
      if (mode === "sport") whPerKm = 22;

      if (weight > 90) whPerKm += 2;
      if (weight < 65) whPerKm -= 1;

      if (speed > 40) whPerKm += 2;
      if (speed < 20) whPerKm -= 1;

      const estimatedRange = usableWh / whPerKm;
      const roundTripDistance = distance * 2;
      const canGoReturn = estimatedRange >= roundTripDistance ? "Oui" : "Non";

      result.innerHTML = `
        Autonomie estimée : ${estimatedRange.toFixed(1)} km<br>
        Aller-retour possible : ${canGoReturn}<br>
        Distance aller-retour : ${roundTripDistance.toFixed(1)} km
      `;
    }

    function resetForm() {
      document.getElementById("batteryPercent").value = "";
      document.getElementById("weight").value = "";
      document.getElementById("voltage").value = "";
      document.getElementById("ah").value = "";
      document.getElementById("wh").value = "";
      document.getElementById("mode").value = "";
      document.getElementById("speed").value = "";
      document.getElementById("distance").value = "";
      document.getElementById("result").innerHTML = "Remplis les champs puis clique sur Calculer";
    }
  </script>
</body>
</html>
