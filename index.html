<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Autonomie Trott</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #101010, #1c1c1c);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #cfcfcf;
      margin-bottom: 22px;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 17px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      background: #f4f4f4;
      color: #111;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .quick-buttons button {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #2c2c2c;
      color: white;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      padding: 14px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      border: none;
    }

    .btn-calc {
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
    }

    .btn-reset {
      background: #2c2c2c;
      color: white;
      border: 1px solid #444;
    }

    .result-box {
      margin-top: 22px;
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    #result {
      font-size: 40px;
      font-weight: bold;
      margin: 10px 0;
      color: white;
    }

    .blink-red {
      color: red !important;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .details {
      font-size: 14px;
      color: #bdbdbd;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #a9a9a9;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Autonomie Trott</h1>
  <div class="subtitle">Estimation simple de batterie restante</div>

  <label>Batterie de départ (%)</label>
  <input type="number" id="batteryStart" value="100">

  <label>Distance aller-retour (km)</label>
  <input type="number" id="distance" value="20">

  <label>Vitesse moyenne</label>
  <select id="speed">
    <option value="18">18 km/h</option>
    <option value="22">22 km/h</option>
    <option value="25" selected>25 km/h</option>
    <option value="28">28 km/h</option>
    <option value="32">32 km/h</option>
    <option value="38">38 km/h</option>
  </select>

  <div class="quick-buttons">
    <button onclick="setDistance(10)">10 km</button>
    <button onclick="setDistance(20)">20 km</button>
    <button onclick="setDistance(30)">30 km</button>
    <button onclick="setDistance(40)">40 km</button>
  </div>

  <div class="actions">
    <button class="btn-calc" onclick="calculateBattery()">Calculer</button>
    <button class="btn-reset" onclick="resetForm()">Reset</button>
  </div>

  <div class="result-box">
    <div id="result">-- %</div>
    <div id="details" class="details"></div>
  </div>

  <div class="footer-note">
    Estimation indicative, ne reflète pas parfaitement la réalité.
  </div>

</div>

<script>
function setDistance(km) {
  document.getElementById("distance").value = km;
  calculateBattery();
}

function resetForm() {
  document.getElementById("batteryStart").value = 100;
  document.getElementById("distance").value = 20;
  document.getElementById("speed").value = 25;
  document.getElementById("result").innerHTML = "-- %";
  document.getElementById("result").className = "";
  document.getElementById("details").innerHTML = "";
}

function calculateBattery() {
  let battery = parseFloat(document.getElementById("batteryStart").value);
  let distance = parseFloat(document.getElementById("distance").value);
  let speed = parseFloat(document.getElementById("speed").value);

  let conso;

  if (speed <= 18) conso = 0.55;
  else if (speed <= 22) conso = 0.68;
  else if (speed <= 25) conso = 0.82;
  else if (speed <= 28) conso = 0.95;
  else if (speed <= 32) conso = 1.12;
  else conso = 1.35;

  let used = distance * conso * 1.05;
  let remaining = battery - used;

  if (remaining < 0) remaining = 0;
  if (remaining > 100) remaining = 100;

  remaining = Math.round(remaining);

  let result = document.getElementById("result");
  let details = document.getElementById("details");

  result.innerHTML = remaining + " %";
  details.innerHTML = "Départ " + battery + "% • " + distance + " km • " + speed + " km/h";

  if (remaining < 30) {
    result.className = "blink-red";
  } else {
    result.className = "";
  }
}
</script>

</body>
</html>
