<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur autonomie</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #00e676;
      margin-bottom: 20px;
    }
    .box {
      max-width: 520px;
      margin: 20px auto;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #00e676;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 12px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Calculateur autonomie</h1>

  <div class="box">
    <input type="number" id="battery" value="100" min="0" max="100" placeholder="Batterie %">
    <input type="number" id="weight" value="107" min="1" placeholder="Poids (kg)">
    <select id="volts">
      <option value="36">36 V</option>
      <option value="48">48 V</option>
      <option value="52">52 V</option>
      <option value="60" selected>60 V</option>
      <option value="72">72 V</option>
    </select>
    <select id="ah">
      <option value="15">15 Ah</option>
      <option value="18">18 Ah</option>
      <option value="20">20 Ah</option>
      <option value="24">24 Ah</option>
      <option value="28">28 Ah</option>
      <option value="30">30 Ah</option>
      <option value="35" selected>35 Ah</option>
      <option value="40">40 Ah</option>
      <option value="45">45 Ah</option>
      <option value="50">50 Ah</option>
    </select>
    <select id="mode">
      <option value="22">Eco</option>
      <option value="30" selected>Confort</option>
            <option value="52">Escalade</option>
    </select>
    <select id="speed">
      <option value="1">25 km/h</option>
      <option value="1.1">35 km/h</option>
      <option value="1.2" selected>45 km/h</option>
      <option value="1.35">55 km/h</option>
    </select>
    <input type="number" id="distance" value="10" min="0" step="0.1" placeholder="Distance aller km">
    <button onclick="calc()">Calculer</button>
    <div id="result">Clique sur calculer</div>
  </div>

  <script>
    function calc() {
      let battery = parseFloat(document.getElementById('battery').value);
      let weight = parseFloat(document.getElementById('weight').value);
      let volts = parseFloat(document.getElementById('volts').value);
      let ah = parseFloat(document.getElementById('ah').value);
      let mode = parseFloat(document.getElementById('mode').value);
      let speed = parseFloat(document.getElementById('speed').value);
      let distance = parseFloat(document.getElementById('distance').value);

      if (isNaN(battery) || isNaN(weight) || isNaN(volts) || isNaN(ah) || isNaN(mode) || isNaN(speed) || isNaN(distance)) {
        document.getElementById('result').innerHTML = 'Merci de remplir tous les champs';
        return;
      }

      if (battery > 100) battery = 100;
      if (battery < 0) battery = 0;
      document.getElementById('battery').value = battery;

      const wh = volts * ah;
      const dispo = wh * (battery / 100);

      // Réglage de conso plus précis
      let weightFactor = 1;
      if (weight <= 75) weightFactor = 0.92;
      else if (weight <= 90) weightFactor = 0.98;
      else if (weight <= 105) weightFactor = 1.05;
      else if (weight <= 120) weightFactor = 1.12;
      else weightFactor = 1.20;

      const conso = mode * speed * weightFactor;
      const autonomie = dispo / conso;
      const ar = distance * 2;
      const whRestants = dispo - (distance * conso * 2);
      let pourcentRestant = (whRestants / wh) * 100;
      if (pourcentRestant < 0) pourcentRestant = 0;

      let txt = '';
      txt += '🔋 Batterie totale : ' + wh.toFixed(0) + ' Wh<br>';
      txt += '⚡ Énergie disponible : ' + dispo.toFixed(0) + ' Wh<br>';
      txt += '⚙️ Consommation estimée : ' + conso.toFixed(1) + ' Wh/km<br>';
      txt += '🛴 Autonomie estimée : ' + autonomie.toFixed(1) + ' km<br>';
      txt += '📏 Distance aller : ' + distance.toFixed(1) + ' km<br>';
      txt += '🔁 Aller-retour : ' + ar.toFixed(1) + ' km<br><br>';

      if (autonomie >= ar) {
        txt += '<span style="color:#00e676;font-weight:bold;">✅ Aller : OUI</span><br>';
        txt += '<span style="color:#00e676;font-weight:bold;">✅ Aller-retour : OUI</span><br>';
        txt += '📉 Marge restante : ' + (autonomie - ar).toFixed(1) + ' km<br>';
        txt += '🔋 Batterie restante estimée : ' + pourcentRestant.toFixed(0) + ' %';
      } else if (autonomie >= distance) {
        const whApresAller = dispo - (distance * conso);
        let pourcentApresAller = (whApresAller / wh) * 100;
        if (pourcentApresAller < 0) pourcentApresAller = 0;

        txt += '<span style="color:#00e676;font-weight:bold;">✅ Aller : OUI</span><br>';
        txt += '<span style="color:orange;font-weight:bold;">⚠️ Aller-retour : NON</span><br>';
        txt += '🔋 Batterie restante estimée à l\'arrivée : ' + pourcentApresAller.toFixed(0) + ' %<br>';
        txt += '👉 Conseil : baisse la vitesse ou le mode pour assurer le retour';
      } else {
        txt += '<span style="color:#ff4d4d;font-weight:bold;">❌ Trajet impossible</span>';
      }

      document.getElementById('result').innerHTML = txt;
    }
  </script>
</body>
</html>
