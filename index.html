<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomie Trott</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

.info {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.input-box {
  display: flex;
  background: white;
  border-radius: 8px;
  overflow: hidden;
}

.input-box input,
.input-box select {
  flex: 1;
  border: none;
  padding: 12px;
  font-size: 16px;
}

.unit {
  background: #eee;
  color: black;
  padding: 12px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 15px;
  background: #00e676;
  border: none;
  font-weight: bold;
  font-size: 16px;
  border-radius: 8px;
  margin-top: 10px;
}

.result {
  margin-top: 20px;
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.8;
}

.good { color: #00e676; }
.warn { color: orange; }
.bad { color: red; }
</style>
</head>

<body>

<div class="container">

<h1>🛴 Calcul autonomie trott</h1>

<div class="info">
<b>Modèle :</b> Dualtron Victor Luxury Plus 60V 35Ah<br>
<b>Autonomie :</b> 64 km à 100%
</div>

<div class="field">
<label>Batterie</label>
<div class="input-box">
<input type="number" id="battery" value="100">
<div class="unit">%</div>
</div>
</div>

<div class="field">
<label>Poids</label>
<div class="input-box">
<input type="number" id="weight" value="107">
<div class="unit">kg</div>
</div>
</div>

<div class="field">
<label>Vitesse</label>
<div class="input-box">
<select id="speed">
<option value="1">25 km/h</option>
<option value="0.9">35 km/h</option>
<option value="0.8">45 km/h</option>
<option value="0.65">55 km/h</option>
</select>
</div>
</div>

<div class="field">
<label>Distance aller</label>
<div class="input-box">
<input type="number" id="distance" value="10">
<div class="unit">km</div>
</div>
</div>

<button onclick="calculate()">Calculer</button>

<div class="result" id="result">
Entre tes valeurs puis clique sur calculer
</div>

</div>

<script>
function calculate() {

let base = 64;

let battery = document.getElementById("battery").value / 100;
let weight = document.getElementById("weight").value;
let speed = document.getElementById("speed").value;
let distance = document.getElementById("distance").value;

let weightCoef = 1;

if(weight > 80) weightCoef = 0.93;
if(weight > 95) weightCoef = 0.85;
if(weight > 110) weightCoef = 0.78;

let autonomy = base * battery * weightCoef * speed;
let roundTrip = distance * 2;
let remaining = autonomy - roundTrip;

let result = "";

result += "🔋 Autonomie : " + autonomy.toFixed(1) + " km<br>";
result += "📏 Aller : " + distance + " km<br>";
result += "🔁 Aller-retour : " + roundTrip + " km<br><br>";

if(autonomy >= roundTrip){
  result += "✅ Aller : OUI<br>";
  result += "✅ Aller-retour : OUI<br>";
  result += "Marge restante : " + remaining.toFixed(1) + " km";
}
else if(autonomy >= distance){
  result += "✅ Aller : OUI<br>";
  result += "⚠️ Retour risqué";
}
else{
  result += "❌ Trajet impossible";
}

document.getElementById("result").innerHTML = result;

}
</script>

</body>
</html>
