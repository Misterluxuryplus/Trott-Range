<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomie Trott</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #00e676;
      margin-bottom: 20px;
    }
    .info {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .input-box {
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    .input-box input,
    .input-box select {
      flex: 1;
      border: none;
      padding: 14px;
      font-size: 16px;
      outline: none;
      background: white;
      color: #111;
    }
    .unit {
      background: #ececec;
      color: black;
      padding: 14px;
      min-width: 60px;
      text-align: center;
      font-weight: bold;
      border-left: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #00e676;
      color: black;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .result {
      margin-top: 22px;
      background: #1c1c1c;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VERSION MODE TEST</h1>

    <div class="info">
      <b>Modèle :</b> Dualtron Victor Luxury Plus 60V 35Ah<br>
      <b>Autonomie :</b> 64 km à 100%
    </div>

    <div class="field">
      <label for="battery">Batterie</label>
      <div class="input-box">
        <input type="number" id="battery" value="100" min="0" max="100" oninput="limitBattery()">
        <div class="unit">%</div>
      </div>
    </div>

    <div class="field">
      <label for="weight">Poids</label>
      <div class="input-box">
        <input type="number" id="weight" value="107" min="1">
        <div class="unit">kg</div>
      </div>
    </div>

    <div class="field">
      <label for="mode">Mode de conduite</label>
      <div class="input-box">
        <select id="mode">
          <option value="1">Éco</option>
          <option value="0.9">Confort</option>
          <option value="0.75">Escalade</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="distance">Distance aller</label>
      <div class="input-box">
        <input type="number" id="distance" value="10" min="0">
        <div class="unit">km</div>
      </div>
    </div>

    <button onclick="calculate()">Calculer</button>

    <div class="result" id="result">
      Test en attente.
    </div>
  </div>

  <script>
    function limitBattery() {
      const input = document.getElementById("battery");
      let v = parseFloat(input.value);
      if (isNaN(v)) return;
      if (v > 100) v = 100;
      if (v < 0) v = 0;
      input.value = v;
    }

    function calculate() {
      limitBattery();

      const base = 64;
      let battery = parseFloat(document.getElementById("battery").value) / 100;
      let weight = parseFloat(document.getElementById("weight").value);
      let mode = parseFloat(document.getElementById("mode").value);
      let distance = parseFloat(document.getElementById("distance").value);

      let weightCoef = 1;
      if (weight > 80) weightCoef = 0.93;
      if (weight > 95) weightCoef = 0.85;
      if (weight > 110) weightCoef = 0.78;

      const autonomy = base * battery * weightCoef * mode;
      const roundTrip = distance * 2;

      document.getElementById("result").innerHTML =
        "Mode choisi : <b>" + document.getElementById("mode").options[document.getElementById("mode").selectedIndex].text + "</b><br>" +
        "Batterie : <b>" + document.getElementById("battery").value + "%</b><br>" +
        "Autonomie estimée : <b>" + autonomy.toFixed(1) + " km</b><br>" +
        "Aller-retour : <b>" + roundTrip.toFixed(1) + " km</b>";
    }
  </script>
</body>
</html>
