<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compact V2</title>

<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  margin:0;
  padding:6px;
}

h1 {
  text-align:center;
  color:#00e676;
  font-size:18px;
  margin:5px 0;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

/* BLOCS */
.box {
  background:#1c1c1c;
  padding:6px;
  border-radius:6px;
}

/* INPUT */
label {
  font-size:11px;
  margin-top:4px;
  display:block;
}

input, select {
  width:100%;
  padding:5px;
  font-size:12px;
  border:none;
  border-radius:4px;
  margin-top:2px;
}

/* BOUTON */
button {
  width:100%;
  padding:6px;
  margin-top:6px;
  background:#00e676;
  border:none;
  font-size:12px;
  border-radius:6px;
  font-weight:bold;
}

/* RESULTAT */
.result {
  margin-top:6px;
  background:#1c1c1c;
  padding:8px;
  border-radius:6px;
  font-size:12px;
  text-align:center;
}

/* MOBILE */
@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>

<div class="grid">

  <div class="box">
    <label>Batterie</label>
    <input type="number" value="100">

    <label>Poids</label>
    <input type="number" value="107">

    <label>Volts</label>
    <select><option>60</option><option>72</option></select>

    <label>Ah</label>
    <select><option>35</option><option>40</option></select>
  </div>

  <div class="box">
    <label>Mode</label>
    <select><option>Eco</option><option>Confort</option></select>

    <label>Vitesse</label>
    <select><option>25</option><option>45</option></select>

    <label>Distance</label>
    <input type="number" value="10">

    <button>OK</button>
  </div>

</div>

<div class="result">
Résultat ici
</div>

</body>
</html>
