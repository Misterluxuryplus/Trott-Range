<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #00ff84;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #ccc;
  margin-bottom: 25px;
}

.container {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 300px;
  background: #161616;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0,255,132,0.1);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #e9e9e9;
  color: black;
  font-size: 16px;
}

.readonly {
  background: #cfd8cc;
  font-weight: bold;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.calc-btn {
  background: #00e56f;
  color: black;
}

.reset-btn {
  background: #333;
  color: white;
}

.result-box {
  margin-top: 20px;
  background: #161616;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0,255,132,0.1);
}

.result-title {
  color: #00ff84;
  font-weight: bold;
  margin-bottom: 10px;
}

.result {
  font-size: 20px;
  font-weight: bold;
}

.note {
  margin-top: 10px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="container">

  <!-- Bloc gauche -->
  <div class="card">
    <h3>🔋 Batterie / Trott</h3>

    <label>Batterie (%)</label>
    <input type="number" id="batteryPercent">

    <label>Poids (kg)</label>
    <input type="number" id="weight">

    <label>Volts (V)</label>
    <input type="number" id="voltage">

    <label>Ampérage (Ah)</label>
    <input type="number" id="ah">

    <label>Capacité batterie (Wh)</label>
    <input type="number" id="wh" class="readonly" readonly>
  </div>

  <!-- Bloc droit -->
  <div class="card">
    <h3>🛣️ Trajet / Conduite</h3>

    <label>Mode de conduite</label>
    <select id="mode">
      <option value="">Choisir</option>
      <option value="eco">Eco</option>
      <option value="confort">Confort</option>
      <option value="sport">Sport</option>
    </select>

    <label>Vitesse (km/h)</label>
    <input type="number" id="speed">

    <label>Distance aller (km)</label>
    <input type="number" id="distance">

    <div class="btn-group">
      <button class="calc-btn" onclick="calculate()">Calculer</button>
      <button class="reset-btn" onclick="resetForm()">Reset</button>
    </div>
  </div>

</div>

<div class="result-box">
  <div class="result-title">📊 Résultat autonomie</div>
  <div class="result" id="result">
    Remplis les champs puis clique sur Calculer
  </div>
  <div class="note">
    Résultat indicatif, ne reflète pas exactement les conditions réelles.
  </div>
</div>

<script>
const voltageInput = document.getElementById("voltage");
const ahInput = document.getElementById("ah");
const whInput = document.getElementById("wh");

function updateWh() {
  let v = parseFloat(voltageInput.value);
  let a = parseFloat(ahInput.value);

  if (!isNaN(v) && !isNaN(a)) {
    whInput.value = (v * a).toFixed(0);
  } else {
    whInput.value = "";
  }
}

voltageInput.addEventListener("input", updateWh);
ahInput.addEventListener("input", updateWh);

function calculate() {
  let battery = parseFloat(document.getElementById("batteryPercent").value);
  let weight = parseFloat(document.getElementById("weight").value);
  let voltage = parseFloat(document.getElementById("voltage").value);
  let ah = parseFloat(document.getElementById("ah").value);
  let speed = parseFloat(document.getElementById("speed").value);
  let distance = parseFloat(document.getElementById("distance").value);
  let mode = document.getElementById("mode").value;

  if (!battery || !weight || !voltage || !ah || !speed || !distance || !mode) {
    document.getElementById("result").innerHTML = "Merci de remplir tous les champs.";
    return;
  }

  let wh = voltage * ah;
  let usable = wh * (battery / 100);

  let whPerKm = 0;

  if (mode === "eco") whPerKm = 11;
  if (mode === "confort") whPerKm = 16;
  if (mode === "sport") whPerKm = 22;

  if (weight > 90) whPerKm += 2;
  if (weight < 65) whPerKm -= 1;

  if (speed > 40) whPerKm += 2;
  if (speed < 20) whPerKm -= 1;

  let autonomie = usable / whPerKm;
  let allerRetour = distance * 2;

  let possible = autonomie >= allerRetour ? "Oui" : "Non";

  document.getElementById("result").innerHTML =
    "Autonomie estimée : " + autonomie.toFixed(1) + " km<br>" +
    "Aller-retour possible : " + possible;
}

function resetForm() {
  document.getElementById("batteryPercent").value = "";
  document.getElementById("weight").value = "";
  document.getElementById("voltage").value = "";
  document.getElementById("ah").value = "";
  document.getElementById("wh").value = "";
  document.getElementById("mode").value = "";
  document.getElementById("speed").value = "";
  document.getElementById("distance").value = "";
  document.getElementById("result").innerHTML =
    "Remplis les champs puis clique sur Calculer";
}
</script>

</body>
</html>
