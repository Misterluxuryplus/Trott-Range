<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Autonomie Trott</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #101010, #1c1c1c);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #cfcfcf;
      margin-bottom: 22px;
      font-size: 15px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 17px;
      font-weight: bold;
      text-align: left;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      background: #f4f4f4;
      color: #111;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .quick-buttons button {
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      background: #2c2c2c;
      color: white;
      border: 1px solid #444;
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-calc {
      background: linear-gradient(135deg, #ff9800, #ff5e00);
      color: white;
    }

    .btn-reset {
      background: #2c2c2c;
      color: white;
      border: 1px solid #444;
    }

    .result-box {
      margin-top: 22px;
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    .result-label {
      font-size: 15px;
      color: #cfcfcf;
      margin-bottom: 8px;
    }

    #result {
      font-size: 40px;
      font-weight: bold;
      margin: 6px 0 8px;
      color: white;
    }

    /* 🔥 ICI JUSTE LA COULEUR CHANGÉE */
    .blink-orange {
      color: red !important;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.35; }
      100% { opacity: 1; }
    }

    .details {
      font-size: 14px;
      color: #bdbdbd;
      line-height: 1.5;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #a9a9a9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Autonomie Trott</h1>
    <div class="subtitle">Estimation simple de batterie restante</div>

    <label for="batteryStart">Batterie de départ (%)</label>
    <input type="number" id="batteryStart" min="1" max="100" value="100">

    <label for="distance">Distance aller-retour (km)</label>
    <input type="number" id="distance" min="1" step="0.1" value="20">

    <label for="speed">Vitesse moyenne</label>
    <select id="speed">
      <option value="18">Eco tranquille (18 km/h)</option>
      <option value="22">Balade (22 km/h)</option>
      <option value="25" selected>Normal (25 km/h)</option>
      <option value="28">Soutenu (28 km/h)</option>
      <option value="32">Rapide (32 km/h)</option>
      <option value="38">Très rapide (38 km/h)</option>
    </select>

    <div class="quick-buttons">
      <button onclick="setDistance(10)">10 km</button>
      <button onclick="setDistance(20)">20 km</button>
      <button onclick="setDistance(30)">30 km</button>
      <button onclick="setDistance(40)">40 km</button>
    </div>

    <div class="actions">
      <button class="btn-calc" onclick="calculateBattery()">Calculer</button>
      <button class="btn-reset" onclick="resetForm()">Réinitialiser</button>
    </div>

    <div class="result-box">
      <div class="result-label">Batterie estimée à l’arrivée</div>
      <div id="result">-- %</div>
      <div id="details" class="details">Entre tes valeurs puis appuie sur calculer.</div>
    </div>

    <div class="footer-note">
      Estimation indicative, ne reflète pas parfaitement la réalité.
    </div>
  </div>

  <script>
    function setDistance(km) {
      document.getElementById("distance").value = km;
      calculateBattery();
    }

    function resetForm() {
      document.getElementById("batteryStart").value = 100;
      document.getElementById("distance").value = 20;
      document.getElementById("speed").value = 25;
      document.getElementById("result").textContent = "-- %";
      document.getElementById("result").className = "";
      document.getElementById("details").textContent = "Entre tes valeurs puis appuie sur calculer.";
    }

    function calculateBattery() {
      const batteryStart = parseFloat(document.getElementById("batteryStart").value);
      const distance = parseFloat(document.getElementById("distance").value);
      const speed = parseFloat(document.getElementById("speed").value);

      let consumptionPerKm;

      if (speed <= 18) consumptionPerKm = 0.55;
      else if (speed <= 22) consumptionPerKm = 0.68;
      else if (speed <= 25) consumptionPerKm = 0.82;
      else if (speed <= 28) consumptionPerKm = 0.95;
      else if (speed <= 32) consumptionPerKm = 1.12;
      else consumptionPerKm = 1.35;

      const used = distance * consumptionPerKm * 1.05;
      let remaining = batteryStart - used;

      if (remaining < 0) remaining = 0;
      if (remaining > 100) remaining = 100;

      remaining = Math.round(remaining);

      const result = document.getElementById("result");
      const details = document.getElementById("details");

      result.textContent = remaining + " %";
      details.textContent = "Départ " + batteryStart + "% • " + distance + " km • " + speed + " km/h";

      if (remaining < 30) {
        result.className = "blink-orange";
      } else {
        result.className = "";
      }
    }
  </script>
</body>
</html>
