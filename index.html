<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST VOLTS AH OK</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:white; margin:0; padding:20px; }
    .container { max-width:700px; margin:auto; }
    h1 { text-align:center; color:red; margin-bottom:20px; }
    .box { background:#1c1c1c; padding:15px; border-radius:12px; margin-bottom:20px; line-height:1.8; }
    .field { margin-bottom:18px; }
    label { display:block; font-weight:bold; margin-bottom:6px; }
    .input-box { display:flex; background:white; border-radius:10px; overflow:hidden; }
    .input-box input, .input-box select {
      flex:1; border:none; padding:14px; font-size:16px; outline:none; background:white; color:#111;
    }
    .unit {
      background:#ececec; color:black; padding:14px; min-width:70px; text-align:center; font-weight:bold; border-left:1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚨 TEST VOLTS + AH + WH OK 🚨</h1>

    <div class="field">
      <label for="volts">Volts</label>
      <div class="input-box">
        <select id="volts" onchange="updateWh()">
          <option value="36">36</option>
          <option value="48">48</option>
          <option value="52">52</option>
          <option value="60" selected>60</option>
          <option value="72">72</option>
        </select>
        <div class="unit">V</div>
      </div>
    </div>

    <div class="field">
      <label for="ah">Ampérage</label>
      <div class="input-box">
        <select id="ah" onchange="updateWh()">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="24">24</option>
          <option value="30">30</option>
          <option value="35" selected>35</option>
          <option value="40">40</option>
        </select>
        <div class="unit">Ah</div>
      </div>
    </div>

    <div class="field">
      <label for="wh">Wh calculés automatiquement</label>
      <div class="input-box">
        <input type="number" id="wh" value="2100" readonly>
        <div class="unit">Wh</div>
      </div>
    </div>

    <div class="box" id="result">Version test chargée.</div>
  </div>

  <script>
    function updateWh() {
      const volts = parseFloat(document.getElementById("volts").value);
      const ah = parseFloat(document.getElementById("ah").value);
      document.getElementById("wh").value = (volts * ah).toFixed(0);
    }
    updateWh();
  </script>
</body>
</html>
