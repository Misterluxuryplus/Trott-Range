<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #00ff84;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #ccc;
  margin-bottom: 25px;
  font-size: 15px;
}

.container {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 300px;
  background: #161616;
  border-radius: 20px;
  padding: 20px;
}

h3 {
  font-size: 18px;
}

label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #e9e9e9;
  color: black;
  font-size: 15px;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.calc-btn {
  background: #00e56f;
  color: black;
}

.reset-btn {
  background: #333;
  color: white;
}

.result-box {
  margin-top: 20px;
  background: #161616;
  border-radius: 20px;
  padding: 20px;
}

.result {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.5;
}

.note {
  margin-top: 10px;
  font-size: 11px;
  color: #aaa;
}
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="container">

  <div class="card">
    <h3>🔋 Batterie / Trott</h3>

    <label>Batterie (%)</label>
    <input type="number" id="batteryPercent" value="100">

    <label>Poids (kg)</label>
    <input type="number" id="weight" value="80">

    <label>Volts (V)</label>
    <input type="number" id="voltage" value="60">

    <label>Ampérage (Ah)</label>
    <input type="number" id="ah" value="35">
  </div>

  <div class="card">
    <h3>🛣️ Trajet / Conduite</h3>

    <label>Mode</label>
    <select id="mode">
      <option value="eco">Eco</option>
      <option value="confort" selected>Confort</option>
      <option value="sport">Sport</option>
    </select>

    <label>Vitesse (km/h)</label>
    <input type="number" id="speed" value="45">

    <label>Distance aller (km)</label>
    <input type="number" id="distance" value="10">

    <div class="btn-group">
      <button class="calc-btn" onclick="calculate()">Calculer</button>
      <button class="reset-btn" onclick="resetForm()">Reset</button>
    </div>
  </div>

</div>

<div class="result-box">
  <div class="result" id="result">
    Clique sur calculer
  </div>
  <div class="note">
    Résultat indicatif, ne reflète pas les conditions réelles.
  </div>
</div>

<script>
function calculate() {
  let battery = parseFloat(document.getElementById("batteryPercent").value);
  let weight = parseFloat(document.getElementById("weight").value);
  let voltage = parseFloat(document.getElementById("voltage").value);
  let ah = parseFloat(document.getElementById("ah").value);
  let speed = parseFloat(document.getElementById("speed").value);
  let distance = parseFloat(document.getElementById("distance").value);
  let mode = document.getElementById("mode").value;

  let wh = voltage * ah;
  let usable = wh * (battery / 100);

  let whPerKm;

  if (mode === "eco") whPerKm = 11;
  if (mode === "confort") whPerKm = 16;
  if (mode === "sport") whPerKm = 22;

  if (weight > 90) whPerKm += 2;
  if (speed > 40) whPerKm += 2;

  let autonomie = usable / whPerKm;
  let allerRetour = distance * 2;

  let conseil = "";

  if (autonomie < allerRetour) {
    conseil = "⚠️ Autonomie insuffisante. Réduis ta vitesse ou passe en mode éco.";
  } else if (speed > 40) {
    conseil = "💡 Tu pourrais gagner en autonomie en roulant moins vite.";
  } else {
    conseil = "✅ Autonomie confortable.";
  }

  document.getElementById("result").innerHTML =
    "Autonomie : " + autonomie.toFixed(1) + " km<br>" +
    "Aller-retour : " + allerRetour + " km<br><br>" +
    conseil;
}

function resetForm() {
  document.getElementById("batteryPercent").value = 100;
  document.getElementById("weight").value = 80;
  document.getElementById("voltage").value = 60;
  document.getElementById("ah").value = 35;
  document.getElementById("mode").value = "confort";
  document.getElementById("speed").value = 45;
  document.getElementById("distance").value = 10;
  document.getElementById("result").innerHTML = "Clique sur calculer";
}
</script>

</body>
</html>
