<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculateur autonomie trottinette</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f7f9fc, #e9eef7);
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .app {
      max-width: 460px;
      margin: auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 22px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p.top {
      text-align: center;
      font-size: 15px;
      color: #666;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .choice-btn {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      background: #edf2ff;
      color: #234;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.07);
    }

    .choice-btn:hover {
      transform: translateY(-1px);
    }

    .choice-btn.active {
      background: #2f6bff;
      color: white;
    }

    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #d5dbe8;
      font-size: 17px;
    }

    .main-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(90deg, #2f6bff, #5f8cff);
      color: white;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(47,107,255,0.25);
    }

    .result {
      margin-top: 22px;
      background: #f4f8ff;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .small-note {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Calculateur d’autonomie</h1>
    <p class="top">Estimation rapide pour trottinette électrique</p>

    <div class="section">
      <label>Voltage</label>
      <div class="btn-group" id="voltageButtons">
        <button class="choice-btn" onclick="selectValue('voltage', 52, this)">52V</button>
        <button class="choice-btn" onclick="selectValue('voltage', 60, this)">60V</button>
        <button class="choice-btn" onclick="selectValue('voltage', 72, this)">72V</button>
      </div>
    </div>

    <div class="section">
      <label>Batterie (Ah)</label>
      <div class="btn-group" id="batteryButtons">
        <button class="choice-btn" onclick="selectValue('battery', 18, this)">18Ah</button>
        <button class="choice-btn" onclick="selectValue('battery', 20, this)">20Ah</button>
        <button class="choice-btn" onclick="selectValue('battery', 24, this)">24Ah</button>
        <button class="choice-btn" onclick="selectValue('battery', 30, this)">30Ah</button>
        <button class="choice-btn" onclick="selectValue('battery', 35, this)">35Ah</button>
        <button class="choice-btn" onclick="selectValue('battery', 40, this)">40Ah</button>
      </div>
    </div>

    <div class="section">
      <label>Poids du pilote (kg)</label>
      <div class="btn-group" id="weightButtons">
        <button class="choice-btn" onclick="selectValue('weight', 60, this)">60 kg</button>
        <button class="choice-btn" onclick="selectValue('weight', 75, this)">75 kg</button>
        <button class="choice-btn" onclick="selectValue('weight', 90, this)">90 kg</button>
        <button class="choice-btn" onclick="selectValue('weight', 110, this)">110 kg</button>
      </div>
    </div>

    <div class="section">
      <label>Mode de conduite</label>
      <div class="btn-group" id="modeButtons">
        <button class="choice-btn" onclick="selectMode('eco', this)">Eco</button>
        <button class="choice-btn" onclick="selectMode('confort', this)">Confort</button>
        <button class="choice-btn" onclick="selectMode('sport', this)">Sport</button>
      </div>
    </div>

    <div class="section">
      <label>Vitesse moyenne estimée (km/h)</label>
      <input type="number" id="speed" value="25" />
    </div>

    <button class="main-btn" onclick="calculateRange()">Calculer</button>

    <div class="result" id="result">
      Choisis les options puis appuie sur Calculer
    </div>

    <div class="small-note">
      Résultat indicatif, pouvant varier selon plusieurs conditions d’utilisation.
    </div>
  </div>

  <script>
    let voltage = 0;
    let battery = 0;
    let weight = 0;
    let mode = "";

    function clearActiveButtons(containerId) {
      const buttons = document.querySelectorAll(`#${containerId} .choice-btn`);
      buttons.forEach(btn => btn.classList.remove("active"));
    }

    function selectValue(type, value, button) {
      if (type === "voltage") {
        voltage = value;
        clearActiveButtons("voltageButtons");
      }
      if (type === "battery") {
        battery = value;
        clearActiveButtons("batteryButtons");
      }
      if (type === "weight") {
        weight = value;
        clearActiveButtons("weightButtons");
      }
      button.classList.add("active");
    }

    function selectMode(selectedMode, button) {
      mode = selectedMode;
      clearActiveButtons("modeButtons");
      button.classList.add("active");

      if (selectedMode === "eco") document.getElementById("speed").value = 20;
      if (selectedMode === "confort") document.getElementById("speed").value = 30;
      if (selectedMode === "sport") document.getElementById("speed").value = 45;
    }

    function calculateRange() {
      const speed = parseFloat(document.getElementById("speed").value);

      if (!voltage || !battery || !weight || !mode || !speed) {
        document.getElementById("result").innerHTML = "Merci de remplir toutes les options.";
        return;
      }

      const wh = voltage * battery;

      let whPerKm = 0;

      if (mode === "eco") whPerKm = 11;
      if (mode === "confort") whPerKm = 16;
      if (mode === "sport") whPerKm = 22;

      // Ajustement léger selon poids
      if (weight <= 65) whPerKm -= 1;
      else if (weight >= 95) whPerKm += 2;

      // Ajustement léger selon vitesse
      if (speed >= 45) whPerKm += 2;
      else if (speed <= 20) whPerKm -= 1;

      const range = wh / whPerKm;
      const safeRange = range * 0.88;

      document.getElementById("result").innerHTML =
        `Autonomie estimée : <br><span style="font-size:28px;">${safeRange.toFixed(1)} km</span>`;
    }
  </script>
</body>
</html>
