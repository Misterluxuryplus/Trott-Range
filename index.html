<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0a2a43, #005bea, #00c6ff);
  color: white;
  padding: 20px;
}

.wrap {
  max-width: 900px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  margin-bottom: 20px;
  color: #e0e0e0;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.card {
  background: rgba(0,0,0,0.75);
  border-radius: 16px;
  padding: 16px;
}

h3 {
  margin-top: 0;
  font-size: 18px;
}

label {
  display: block;
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
  color: black;
  font-size: 15px;
}

input[readonly] {
  background: #ddd;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #00e56f;
  font-weight: bold;
  cursor: pointer;
}

.result-card {
  margin-top: 18px;
  background: rgba(0,0,0,0.75);
  border-radius: 16px;
  padding: 16px;
}

.result {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.6;
}

.good { color: #00ff84; }
.warn { color: #ffcc66; }
.bad { color: #ff6b6b; }

.note {
  margin-top: 10px;
  font-size: 12px;
  color: #ccc;
}

@media (max-width: 700px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="grid">

  <div class="card">
    <h3>🔋 Batterie</h3>

    <label>Batterie (%)</label>
    <input type="number" value="100" readonly>

    <label>Poids (kg)</label>
    <input type="number" id="weight" value="80">

    <label>Volts (V)</label>
    <input type="number" id="voltage" value="60">

    <label>Capacité (Ah)</label>
    <input type="number" id="ah" value="35">
  </div>

  <div class="card">
    <h3>🛣️ Trajet</h3>

    <label>Mode</label>
    <select id="mode">
      <option value="eco">Eco</option>
      <option value="confort" selected>Confort</option>
      <option value="sport">Sport</option>
    </select>

    <label>Vitesse (km/h)</label>
    <input type="number" id="speed" value="45">

    <label>Distance aller (km)</label>
    <input type="number" id="distance" value="10">

    <button onclick="calculate()">Calculer</button>
  </div>

</div>

<div class="result-card">
  <div class="result" id="result">
    Clique sur calculer
  </div>

  <div class="note">
    Résultat indicatif. Le vent, les côtes ou le style de conduite peuvent influencer.
  </div>
</div>

</div>

<script>
function calculate() {
  const weight = +document.getElementById("weight").value;
  const voltage = +document.getElementById("voltage").value;
  const ah = +document.getElementById("ah").value;
  const speed = +document.getElementById("speed").value;
  const distance = +document.getElementById("distance").value;
  const mode = document.getElementById("mode").value;

  let whPerKm = (mode === "eco") ? 11 : (mode === "confort") ? 16 : 22;

  if (weight > 90) whPerKm += 2;
  if (speed > 40) whPerKm += 2;

  const autonomie = (voltage * ah) / whPerKm;

  const allerOK = autonomie >= distance;
  const arOK = autonomie >= distance * 2;

  let message = "";
  let cls = "good";

  if (!allerOK) {
    message = "Autonomie insuffisante même pour l'aller.";
    cls = "bad";
  } else if (!arOK) {
    message = "Aller possible mais pas le retour.";
    cls = "warn";
  } else if (speed > 40) {
    message = "Trajet OK mais tu peux gagner en autonomie en roulant moins vite.";
    cls = "warn";
  } else {
    message = "Autonomie confortable.";
  }

  document.getElementById("result").innerHTML =
    "Aller : " + (allerOK ? "OK" : "NON") + "<br>" +
    "Aller-retour : " + (arOK ? "OK" : "NON") + "<br><br>" +
    "<span class='" + cls + "'>" + message + "</span>";
}
</script>

</body>
</html>
