<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur Autonomie</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 15px;
}

.container {
  max-width: 400px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #007bff;
  color: white;
  font-size: 16px;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #e9f3ff;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>Calculateur autonomie</h2>

  <label>Voltage (V)</label>
  <input type="number" id="voltage" value="60">

  <label>Batterie (Ah)</label>
  <input type="number" id="battery" value="30">

  <label>Poids (kg)</label>
  <input type="number" id="weight" value="80">

  <label>Mode</label>
  <select id="mode">
    <option value="eco">Eco</option>
    <option value="confort">Confort</option>
    <option value="sport">Sport</option>
  </select>

  <label>Vitesse (km/h)</label>
  <input type="number" id="speed" value="25">

  <button onclick="calculate()">Calculer</button>

  <div class="result" id="result">
    Résultat ici
  </div>
</div>

<script>
function calculate() {
  let voltage = parseFloat(document.getElementById("voltage").value);
  let battery = parseFloat(document.getElementById("battery").value);
  let weight = parseFloat(document.getElementById("weight").value);
  let speed = parseFloat(document.getElementById("speed").value);
  let mode = document.getElementById("mode").value;

  let wh = voltage * battery;

  let whPerKm;

  if (mode === "eco") whPerKm = 11;
  if (mode === "confort") whPerKm = 16;
  if (mode === "sport") whPerKm = 22;

  if (weight > 90) whPerKm += 2;
  if (weight < 65) whPerKm -= 1;

  if (speed > 40) whPerKm += 2;
  if (speed < 20) whPerKm -= 1;

  let range = wh / whPerKm;
  let safeRange = range * 0.88;

  document.getElementById("result").innerHTML =
    "Autonomie estimée : " + safeRange.toFixed(1) + " km";
}
</script>

</body>
</html>
