<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0a2a43, #005bea, #00c6ff);
  color: white;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: rgba(0,0,0,0.7);
  padding: 20px;
  border-radius: 15px;
}

h2 {
  text-align: center;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #00e56f;
  font-weight: bold;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #111;
  border-radius: 10px;
  font-size: 16px;
  line-height: 1.6;
}

.good { color: #00ff84; }
.warn { color: orange; }
.bad { color: red; }
</style>
</head>

<body>

<div class="container">

<h2>Calculateur autonomie</h2>

<label>Batterie (%)</label>
<input type="number" value="100" readonly>

<label>Poids (kg)</label>
<input type="number" id="weight" value="80">

<label>Volts (V)</label>
<input type="number" id="voltage" value="60">

<label>Ah</label>
<input type="number" id="ah" value="35">

<label>Mode</label>
<select id="mode">
  <option value="eco">Eco</option>
  <option value="confort" selected>Confort</option>
  <option value="sport">Sport</option>
</select>

<label>Vitesse</label>
<input type="number" id="speed" value="45">

<label>Distance aller</label>
<input type="number" id="distance" value="10">

<button onclick="calculate()">Calculer</button>

<div class="result" id="result">Résultat ici</div>

</div>

<script>
function calculate() {

  let weight = +document.getElementById("weight").value;
  let voltage = +document.getElementById("voltage").value;
  let ah = +document.getElementById("ah").value;
  let speed = +document.getElementById("speed").value;
  let distance = +document.getElementById("distance").value;
  let mode = document.getElementById("mode").value;

  let wh = voltage * ah;

  let whPerKm = (mode === "eco") ? 11 : (mode === "confort") ? 16 : 22;

  if (weight > 90) whPerKm += 2;
  if (speed > 40) whPerKm += 2;

  let autonomie = wh / whPerKm;

  let consoAller = distance * whPerKm;
  let consoAR = distance * 2 * whPerKm;

  let batterieAller = 100 - (consoAller / wh * 100);
  let batterieAR = 100 - (consoAR / wh * 100);

  batterieAller = Math.max(0, batterieAller);
  batterieAR = Math.max(0, batterieAR);

  let allerOK = autonomie >= distance;
  let arOK = autonomie >= distance * 2;

  let message = "";
  let cls = "good";

  if (!allerOK) {
    message = "Impossible même pour l'aller";
    cls = "bad";
  } else if (!arOK) {
    message = "Aller possible mais pas le retour";
    cls = "warn";
  } else if (speed > 40) {
    message = "OK mais tu peux gagner en autonomie en roulant moins vite";
    cls = "warn";
  } else {
    message = "Autonomie confortable";
  }

  document.getElementById("result").innerHTML =
    "Autonomie : " + autonomie.toFixed(1) + " km<br><br>" +
    "Aller : " + (allerOK ? "OK" : "NON") + "<br>" +
    "Aller-retour : " + (arOK ? "OK" : "NON") + "<br><br>" +
    "Batterie après aller : " + batterieAller.toFixed(0) + "%<br>" +
    "Batterie après A/R : " + batterieAR.toFixed(0) + "%<br><br>" +
    "<span class='" + cls + "'>" + message + "</span>";
}
</script>

</body>
</html>
