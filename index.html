<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test 2 colonnes</title>
<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box {
  background:#1c1c1c;
  padding:20px;
  border-radius:10px;
}

.result {
  margin-top:20px;
  background:#1c1c1c;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h1 style="text-align:center;color:#00e676;">TEST 2 COLONNES</h1>

<div class="grid">
  <div class="box">Colonne gauche</div>
  <div class="box">Colonne droite</div>
</div>

<div class="result">
Résultat ici
</div>

</body>
</html>
