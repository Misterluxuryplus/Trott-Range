<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur autonomie V10</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #00e676;
      margin-bottom: 8px;
      font-size: 48px;
    }

    .version {
      text-align: center;
      color: yellow;
      font-weight: bold;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 18px;
      color: #00e676;
      font-size: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .input-box {
      display: flex;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .input-box input,
    .input-box select {
      flex: 1;
      border: none;
      padding: 16px;
      font-size: 18px;
      outline: none;
      background: white;
      color: #111;
    }

    .unit {
      background: #ececec;
      color: black;
      padding: 16px;
      min-width: 80px;
      text-align: center;
      font-weight: bold;
      border-left: 1px solid #ccc;
      font-size: 18px;
    }

    .actions {
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 18px;
      background: #00e676;
      color: black;
      border: none;
      border-radius: 14px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      line-height: 2;
      font-size: 20px;
    }

    .result h2 {
      margin-top: 0;
      color: #00e676;
      font-size: 28px;
      margin-bottom: 16px;
    }

    .good { color: #00e676; font-weight: bold; }
    .warn { color: orange; font-weight: bold; }
    .bad  { color: #ff4d4d; font-weight: bold; }

    @media (max-width: 900px) {
      h1 {
        font-size: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card h2,
      .result h2 {
        font-size: 22px;
      }

      .input-box input,
      .input-box select,
      .unit {
        font-size: 16px;
        padding: 14px;
      }

      button {
        font-size: 20px;
      }

      .result {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculateur autonomie</h1>
    <div class="version">VERSION V10</div>

    <div class="grid">
      <div class="card">
        <h2>🔋 Batterie / Trott</h2>

        <div class="field">
          <label for="battery">Batterie actuelle</label>
          <div class="input-box">
            <input type="number" id="battery" value="100" min="0" max="100" oninput="limitBattery()">
            <div class="unit">%</div>
          </div>
        </div>

        <div class="field">
          <label for="weight">Poids</label>
          <div class="input-box">
            <input type="number" id="weight" value="107" min="1">
            <div class="unit">kg</div>
          </div>
        </div>

        <div class="field">
          <label for="volts">Volts</label>
          <div class="input-box">
            <select id="volts" onchange="updateWh()">
              <option value="36">36</option>
              <option value="48">48</option>
              <option value="52">52</option>
              <option value="60" selected>60</option>
              <option value="72">72</option>
            </select>
            <div class="unit">V</div>
          </div>
        </div>

        <div class="field">
          <label for="ah">Ampérage</label>
          <div class="input-box">
            <select id="ah" onchange="updateWh()">
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="15">15</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="28">28</option>
              <option value="30">30</option>
              <option value="35" selected>35</option>
              <option value="40">40</option>
              <option value="45">45</option>
              <option value="50">50</option>
            </select>
            <div class="unit">Ah</div>
          </div>
        </div>

        <div class="field">
          <label for="wh">Wh calculés automatiquement</label>
          <div class="input-box">
            <input type="number" id="wh" value="2100" readonly>
            <div class="unit">Wh</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>🛣️ Trajet / Conduite</h2>

        <div class="field">
          <label for="mode">Mode de conduite</label>
          <div class="input-box">
            <select id="mode">
              <option value="22">Éco</option>
              <option value="30" selected>Confort</option>
              <option value="40">Sport</option>
              <option value="52">Escalade</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="speed">Vitesse</label>
          <div class="input-box">
            <select id="speed">
              <option value="1.00">25 km/h</option>
              <option value="1.08">35 km/h</option>
              <option value="1.18" selected>45 km/h</option>
              <option value="1.32">55 km/h</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="distance">Distance aller</label>
          <div class="input-box">
            <input type="number" id="distance" value="10" min="0" step="0.1">
            <div class="unit">km</div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button onclick="calculate()">Calculer</button>
    </div>

    <div class="result" id="result">
      <h2>📊 Résultat autonomie</h2>
      Clique sur calculer.
    </div>
  </div>

  <script>
    function limitBattery() {
      const input = document.getElementById("battery");
      let value = parseFloat(input.value);
      if (isNaN(value)) return;
      if (value > 100) value = 100;
      if (value < 0) value = 0;
      input.value = value;
    }

    function updateWh() {
      const volts = parseFloat(document.getElementById("volts").value);
      const ah = parseFloat(document.getElementById("ah").value);
      if (isNaN(volts) || isNaN(ah)) {
        document.getElementById("wh").value = "";
        return;
      }
      document.getElementById("wh").value = (volts * ah).toFixed(0);
    }

    function getWeightAdjustment(weight) {
      if (weight <= 70) return 0.92;
      if (weight <= 85) return 0.97;
      if (weight <= 100) return 1.00;
      if (weight <= 115) return 1.05;
      if (weight <= 130) return 1.12;
      return 1.20;
    }

    function calculate() {
      limitBattery();
      updateWh();

      const battery = parseFloat(document.getElementById("battery").value);
      const weight = parseFloat(document.getElementById("weight").value);
      const wh = parseFloat(document.getElementById("wh").value);
      const modeWhKm = parseFloat(document.getElementById("mode").value);
      const speedFactor = parseFloat(document.getElementById("speed").value);
      const distance = parseFloat(document.getElementById("distance").value);

      if (isNaN(battery) || isNaN(weight) || isNaN(wh) || isNaN(modeWhKm) || isNaN(speedFactor) || isNaN(distance)) {
        document.getElementById("result").innerHTML =
          "<h2>📊 Résultat autonomie</h2>⚠️ Merci de remplir tous les champs.";
        return;
      }

      const availableWh = wh * (battery / 100);
      const realWhKm = modeWhKm * getWeightAdjustment(weight) * speedFactor;
      const autonomy = availableWh / realWhKm;
      const roundTrip = distance * 2;
      const remaining = autonomy - roundTrip;

      const modeName = document.getElementById("mode").options[document.getElementById("mode").selectedIndex].text;
      const speedName = document.getElementById("speed").options[document.getElementById("speed").selectedIndex].text;

      let html = "<h2>📊 Résultat autonomie</h2>";
      html += "🔋 <b>Batterie totale :</b> " + wh.toFixed(0) + " Wh<br>";
      html += "⚡ <b>Énergie disponible :</b> " + availableWh.toFixed(0) + " Wh<br>";
      html += "⚙️ <b>Mode :</b> " + modeName + "<br>";
      html += "🚀 <b>Vitesse :</b> " + speedName + "<br>";
      html += "⚖️ <b>Consommation estimée :</b> " + realWhKm.toFixed(1) + " Wh/km<br>";
      html += "🛴 <b>Autonomie estimée :</b> " + autonomy.toFixed(1) + " km<br>";
      html += "📏 <b>Distance aller :</b> " + distance.toFixed(1) + " km<br>";
      html += "🔁 <b>Distance aller-retour :</b> " + roundTrip.toFixed(1) + " km<br><br>";

      if (autonomy >= roundTrip) {
        html += "✅ <b>Aller :</b> <span class='good'>OUI</span><br>";
        html += "✅ <b>Aller-retour :</b> <span class='good'>OUI</span><br>";
        html += "📉 <b>Marge restante :</b> " + remaining.toFixed(1) + " km";
      } else if (autonomy >= distance) {
        html += "✅ <b>Aller :</b> <span class='good'>OUI</span><br>";
        html += "⚠️ <b>Aller-retour :</b> <span class='warn'>NON</span><br>";
        html += "👉 <b>Conseil :</b> baisse la vitesse ou le mode";
      } else {
        html += "❌ <b>Aller :</b> <span class='bad'>NON</span><br>";
        html += "❌ <b>Aller-retour :</b> <span class='bad'>NON</span>";
      }

      document.getElementById("result").innerHTML = html;
    }

    updateWh();
  </script>
</body>
</html>
