<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur autonomie</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #00ff84;
  margin-bottom: 5px;
  font-size: 26px;
}

.subtitle {
  text-align: center;
  color: #ccc;
  margin-bottom: 22px;
  font-size: 14px;
}

.container {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 300px;
  background: #161616;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 0 20px rgba(0,255,132,0.08);
}

h3 {
  margin-top: 0;
  font-size: 18px;
  margin-bottom: 12px;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  border: none;
  background: #e9e9e9;
  color: black;
  font-size: 15px;
  box-sizing: border-box;
}

.readonly {
  background: #cfd8cc;
  font-weight: bold;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.calc-btn {
  background: #00e56f;
  color: black;
}

.reset-btn {
  background: #333;
  color: white;
}

.result-box {
  margin-top: 18px;
  background: #161616;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 0 20px rgba(0,255,132,0.08);
}

.result-title {
  color: #00ff84;
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 16px;
}

.result {
  font-size: 17px;
  font-weight: bold;
  line-height: 1.6;
}

.note {
  margin-top: 10px;
  font-size: 11px;
  color: #aaa;
}

.good { color: #00ff84; }
.warn { color: #ffb347; }
.bad  { color: #ff6b6b; }

@media (max-width: 600px) {
  h1 { font-size: 23px; }
  .subtitle { font-size: 13px; }
  h3 { font-size: 17px; }
  label { font-size: 13px; }
  input, select, button { font-size: 14px; }
  .result { font-size: 16px; }
}
</style>
</head>

<body>

<h1>Calculateur autonomie</h1>
<div class="subtitle">Estimation rapide avant un trajet</div>

<div class="container">

  <div class="card">
    <h3>🔋 Batterie / Trott</h3>

    <label>Batterie actuelle (%)</label>
    <input type="number" id="batteryPercent" value="100">

    <label>Poids pilote (kg)</label>
    <input type="number" id="weight" value="80">

    <label>Volts (V)</label>
    <input type="number" id="voltage" value="60">

    <label>Ampérage (Ah)</label>
    <input type="number" id="ah" value="35">

    <label>Capacité batterie totale (Wh)</label>
    <input type="number" id="wh" class="readonly" readonly>
  </div>

  <div class="card">
    <h3>🛣️ Trajet / Conduite</h3>

    <label>Mode de conduite</label>
    <select id="mode">
      <option value="eco">Eco</option>
      <option value="confort" selected>Confort</option>
      <option value="sport">Sport</option>
    </select>

    <label>Vitesse moyenne (km/h)</label>
    <input type="number" id="speed" value="45">

    <label>Distance aller (km)</label>
    <input type="number" id="distance" value="10">

    <div class="btn-group">
      <button class="calc-btn" onclick="calculate()">Calculer</button>
      <button class="reset-btn" onclick="resetForm()">Reset</button>
    </div>
  </div>

</div>

<div class="result-box">
  <div class="result-title">📊 Résultat autonomie</div>
  <div class="result" id="result">
    Modifie les valeurs puis clique sur Calculer
  </div>
  <div class="note">
    Résultat indicatif, ne reflète pas exactement la réalité.
  </div>
</div>

<script>
const voltageInput = document.getElementById("voltage");
const ahInput = document.getElementById("ah");
const whInput = document.getElementById("wh");

function updateWh() {
  const v = parseFloat(voltageInput.value);
  const a = parseFloat(ahInput.value);

  if (!isNaN(v) && !isNaN(a)) {
    whInput.value = (v * a).toFixed(0);
  } else {
    whInput.value = "";
  }
}

voltageInput.addEventListener("input", updateWh);
ahInput.addEventListener("input", updateWh);
updateWh();

function calculate() {
  const batteryPercent = parseFloat(document.getElementById("batteryPercent").value);
  const weight = parseFloat(document.getElementById("weight").value);
  const voltage = parseFloat(document.getElementById("voltage").value);
  const ah = parseFloat(document.getElementById("ah").value);
  const speed = parseFloat(document.getElementById("speed").value);
  const distance = parseFloat(document.getElementById("distance").value);
  const mode = document.getElementById("mode").value;
  const result = document.getElementById("result");

  if (
    isNaN(batteryPercent) ||
    isNaN(weight) ||
    isNaN(voltage) ||
    isNaN(ah) ||
    isNaN(speed) ||
    isNaN(distance) ||
    !mode
  ) {
    result.innerHTML = "Merci de remplir tous les champs.";
    return;
  }

  const totalWh = voltage * ah;
  const usableWh = totalWh * (batteryPercent / 100);

  let whPerKm = 0;

  if (mode === "eco") whPerKm = 11;
  if (mode === "confort") whPerKm = 16;
  if (mode === "sport") whPerKm = 22;

  if (weight >= 95) whPerKm += 2;
  else if (weight <= 65) whPerKm -= 1;

  if (speed >= 50) whPerKm += 3;
  else if (speed > 40) whPerKm += 2;
  else if (speed < 20) whPerKm -= 1;

  const autonomie = usableWh / whPerKm;
  const aller = distance;
  const allerRetour = distance * 2;

  const resteApresAllerKm = autonomie - aller;
  const resteApresARKm = autonomie - allerRetour;

  let batterieRestanteAller = (resteApresAllerKm / autonomie) * batteryPercent;
  let batterieRestanteAR = (resteApresARKm / autonomie) * batteryPercent;

  if (!isFinite(batterieRestanteAller)) batterieRestanteAller = 0;
  if (!isFinite(batterieRestanteAR)) batterieRestanteAR = 0;

  batterieRestanteAller = Math.max(0, batterieRestanteAller);
  batterieRestanteAR = Math.max(0, batterieRestanteAR);

  const allerPossible = autonomie >= aller;
  const arPossible = autonomie >= allerRetour;

  let conseil = "";
  let conseilClass = "good";

  if (!allerPossible) {
    conseil = "Autonomie trop juste, même l'aller paraît risqué.";
    conseilClass = "bad";
  } else if (allerPossible && !arPossible) {
    conseil = "L'aller semble possible, mais pas le retour complet.";
    conseilClass = "warn";
  } else if (speed > 40 && mode !== "eco") {
    conseil = "En baissant la vitesse ou en roulant plus calme, tu peux gagner de l'autonomie.";
    conseilClass = "warn";
  } else {
    conseil = "Autonomie confortable pour ce trajet.";
    conseilClass = "good";
  }

  result.innerHTML = `
    Autonomie estimée : ${autonomie.toFixed(1)} km<br>
    Aller possible : <span class="${allerPossible ? 'good' : 'bad'}">${allerPossible ? 'Oui' : 'Non'}</span><br>
    Aller-retour possible : <span class="${arPossible ? 'good' : 'bad'}">${arPossible ? 'Oui' : 'Non'}</span><br>
    Batterie restante après l'aller : ${batterieRestanteAller.toFixed(0)} %<br>
    Batterie restante après l'aller-retour : ${batterieRestanteAR.toFixed(0)} %<br><br>
    <span class="${conseilClass}">${conseil}</span>
  `;
}

function resetForm() {
  document.getElementById("batteryPercent").value = 100;
  document.getElementById("weight").value = 80;
  document.getElementById("voltage").value = 60;
  document.getElementById("ah").value = 35;
  document.getElementById("mode").value = "confort";
  document.getElementById("speed").value = 45;
  document.getElementById("distance").value = 10;
  updateWh();
  document.getElementById("result").innerHTML = "Modifie les valeurs puis clique sur Calculer";
}
</script>

</body>
</html>
