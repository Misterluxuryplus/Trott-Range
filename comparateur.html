<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur Trottinettes</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #103b75, #1565e8, #1da9e8);
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

h1 {
  font-size: 28px;
}

input, select, button {
  width: 90%;
  max-width: 300px;
  padding: 12px;
  margin: 10px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}

button {
  background: #00c853;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 10px;
}

.result {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

.result:hover {
  transform: scale(1.03);
}

.good { color: #00ff88; font-weight: bold; }
.mid { color: orange; font-weight: bold; }
.bad { color: red; font-weight: bold; }

.footer {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🔍 Comparateur Trottinettes</h1>

  <input type="number" id="distance" placeholder="Distance (km)">
  <input type="number" id="poids" placeholder="Poids (kg)">

  <button onclick="calculer()">Voir les résultats</button>

  <div id="results"></div>

  <div class="footer">
    ⚠️ Estimation basée sur des conditions moyennes.<br>
    Le vent, les montées et la conduite influencent fortement l’autonomie.<br>
    Prévoir une marge de sécurité.
  </div>
</div>

<script>

const trotts = [
  {nom:"Xiaomi 4 Lite", wh:187, poids:16},
  {nom:"Xiaomi 4", wh:275, poids:17},
  {nom:"Xiaomi 4 Pro", wh:446, poids:19},
  {nom:"Segway E2 Pro", wh:275, poids:18},
  {nom:"Segway F2", wh:367, poids:17},
  {nom:"Segway G30", wh:551, poids:19}
];

function calculer() {
  let distance = parseFloat(document.getElementById("distance").value);
  let poids = parseFloat(document.getElementById("poids").value);

  if (!distance || !poids) {
    alert("Remplis les champs !");
    return;
  }

  let results = document.getElementById("results");
  results.innerHTML = "";

  let liste = [];

  trotts.forEach(trott => {

    let conso = 18 + ((poids - 70) * 0.1);
    let autonomie = trott.wh / conso;

    let score = autonomie - distance;

    let statut = "";
    let classe = "";

    if (autonomie > distance * 1.5) {
      statut = "🟢 OK large";
      classe = "good";
    } else if (autonomie > distance) {
      statut = "🟠 Limite";
      classe = "mid";
    } else {
      statut = "🔴 Pas conseillé";
      classe = "bad";
    }

    liste.push({
      ...trott,
      autonomie,
      statut,
      classe,
      score
    });
  });

  // 🔥 TRI DU MEILLEUR AU PIRE
  liste.sort((a,b) => b.score - a.score);

  // 🔥 AFFICHAGE
  liste.forEach(trott => {
    results.innerHTML += `
      <div class="result">
        <h3>${trott.nom}</h3>
        🔋 Autonomie estimée : <b>${trott.autonomie.toFixed(1)} km</b><br>
        ⚖️ Poids : ${trott.poids} kg<br><br>
        <span class="${trott.classe}">${trott.statut}</span>
      </div>
    `;
  });
}

</script>

</body>
</html>
